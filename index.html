<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/view.css">
  <title>Smash The Hunger</title>
</head>

<body>
  <header class="logo">
    <h1>smash the hunger<img src="images/logo.jpeg" alt="logo" class="image"></h1>
    <a href="https://www.linkedin.com/in/ahmad-samer-b88bb4423/">My Linkedin</a>
  </header>
  <section class="menu">
    <div class="titles">
      <h2>Our Menu</h2>
    </div>
    <div class="first-burger">
      <figure>
        <img src="images/cheese.png" alt="Cheese Burger">
        <figcaption>cheese burger</figcaption>
      </figure>
      
      <form action="">
      <div class="size">
        <label for="size">Size: </label>
        <input type="radio" value="Large" name="size" id="size" required>
        <label for="size">Large</label>
        <input type="radio" value="medium" name="size" id="size">
        <label for="size">Medium</label>
        <input type="radio" value="small" name="size" id="size">
        <label for="size">Small</label>
      </div>
        <br>
      <div class="extras">
        <label for="extras">Fries&drink?</label>
        <input type="radio" value="Yes" name="Fries&drink" id="extras" required>
        <label for="extras">Yes</label>
        <input type="radio" value="No" name="Fries&drink" id="extras">
        <label for="extras">No</label>
      </div>
        <br>
        <div class="number">
        <input type="number" name="number" min="0" step="1" placeholder="How many burgers?" required>
        </div>
          <input type="submit" value="Add to cart" class="add">
      </form>
    </div>
    <div class="second-burger">
      <figure>
        <img src="images/mushroom.png" alt="Mushroom Burger" >
        <figcaption>mushroom burger</figcaption>
      </figure>
     <form action="">
   <div class="size">
    <label for="size">Size: </label>
    <input type="radio" value="Large" name="size" id="size" required>
    <label for="size">Large</label>

    <label for="size">Medium</label>
    <input type="radio" value="small" name="size" id="size">
    <label for="size">Small</label>
   </div>
   <br>
   <div class="extras">
    <label for="extras">Fries&drink?</label>
    <input type="radio" value="Yes" name="Fries&drink" id="extras" required>
    <label for="extras">Yes</label>
    <input type="radio" value="No" name="Fries&drink" id="extras">
    <label for="extras">No</label>
   </div>
   <br>
   <div class="number">
    <input type="number" name="number" min="0" step="1" placeholder="How many burgers?" required>
   </div>
   <input type="submit" value="Add to cart" class="add">
   </form>
  </div>
  </section>
